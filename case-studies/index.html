  <script>
    (function(){
      var grid=document.getElementById('articlesGrid');
      if(!grid||typeof ARTICLES==='undefined')return;
      // 按日期降序排列
      var sorted=ARTICLES.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
      sorted.forEach(function(a){
        var c=document.createElement('a');
        c.className='article-card';
        c.setAttribute('data-category',a.category);
        c.setAttribute('data-id',a.id);
        c.href='../consultation/'+a.id+'.html';
        // 阅读时长估算
        var textLen=(a.content||'').replace(/<[^>]*>/g,'').length;
        var mins=Math.max(1,Math.round(textLen/400));
        c.innerHTML='<span class="article-card-category">'+a.category+'</span>'+
          '<h3>'+a.title+'</h3>'+
          '<p class="article-card-excerpt">'+a.summary+'</p>'+
          '<div class="article-card-meta"><span>'+a.date+'</span><span class="dot"></span><span>'+(a.author||'')+'</span><span class="dot"></span><span>约 '+mins+' 分钟</span></div>'+
          '<span class="article-card-read">阅读全文 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></span>';
        grid.appendChild(c);
      });
    })();
  </script>
